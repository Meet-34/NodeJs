<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f8f5f0;
            color: #0b3d2e;
        }

        header {
            background-color: #0b3d2e;
            color: #f8f5f0;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #eae6df;
            padding: 10px;
            text-align: center;
        }

        nav a {
            margin: 0 15px;
            color: #0b3d2e;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 250px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #0b3d2e;
            color: #f8f5f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #145c45;
        }
    </style>
</head>
<body>

<header>
    <h1>Login</h1>
</header>

<nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/login">Login</a>
    <a href="/signup">Signup</a>
</nav>

<div class="container">
    <form action="/login-submit" method="POST">
        <label for="101">Name</label><br>
        <input type="text" id="101" name="username" placeholder="Enter your name.."><br><br>
        <label for="102">Email</label><br>
        <input type="email" id="102" name="usermail" placeholder="Enter your email.."><br><br>
        <label for="103">Password</label><br>
        <input type="text" id="103" name="userpass"><br><br>
        <label for="104">Confirm Password</label><br>
        <input type="text" id="104" name="confirmpass"><br><br>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
